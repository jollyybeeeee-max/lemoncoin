<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F5F6EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13150F" media="(prefers-color-scheme: dark)">
<title>레몬코인 · 파르나스</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%23E9BD10'/%3E%3Ccircle cx='20' cy='20' r='16' fill='%23FFFBE8'/%3E%3Ccircle cx='20' cy='20' r='14' fill='%23F8E15A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레몬코인 보드의 디자인 시스템 + 한 페이지 구성: 내 코인 → 순위(시상대) → 리워드 메뉴 (명예의 전당은 헤더 버튼) → 모으는 법 */
:root{
  --bg:#F5F6EF; --surface:#FFFFFF; --ink:#1B1E17; --muted:#666B5E; --line:#E1E3D7;
  --lemon:#F3D433; --lemon-soft:#FBF0B4; --on-lemon:#2B2400; --good:#2E7A4C; --bad:#B0432E;
  --silver:#D9DCD2; --bronze:#C9894F;
  --rind:#E9BD10; --pith:#FFFBE8; --pulp:#F8E15A; --leaf:#4F9A3C;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#13150F; --surface:#1C1F17; --ink:#EDEFE4; --muted:#9CA190; --line:#2E3227;
  --lemon:#E9C925; --lemon-soft:#3A3412; --on-lemon:#231D00; --good:#6CC08E; --bad:#E4826C; --silver:#4C5145; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:max(48px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* header */
header{display:flex;align-items:center;gap:12px}
header>div{min-width:0}
.coin{width:46px;height:46px;flex:none}
.ttl{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1;margin:0;letter-spacing:.01em}
.store{font-size:12px;font-weight:500;color:var(--muted);opacity:.75;letter-spacing:.02em}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.updated{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:-6px}
.live{width:7px;height:7px;border-radius:50%;background:var(--good)}
.live.off{background:var(--bad)}

/* ticker */
.ticker{background:var(--lemon);color:var(--on-lemon);border-radius:12px;overflow:hidden;white-space:nowrap;font-size:14px;font-weight:500}
.ticker-track{display:inline-flex;gap:26px;padding:10px 14px;animation:roll var(--dur,40s) linear infinite}
.ticker-track span{display:inline-flex;gap:5px;align-items:center}
.ticker-track b{font-weight:700}
.ticker-track span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--on-lemon);opacity:.35;margin-right:4px}
@keyframes roll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;line-height:1.1}
.card-h .meta{margin-left:auto}
.meta{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
.note.warn{border-style:solid;border-color:var(--bad);color:var(--bad)}
.amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.amt.p{color:var(--good)} .amt.m{color:var(--bad)}
.dot{width:16px;height:16px;flex:none;border-radius:50%;border:2px solid var(--rind);box-shadow:inset 0 0 0 1px var(--pith);background:radial-gradient(circle,var(--pith) 0 16%,transparent 17%),repeating-conic-gradient(from 22.5deg,var(--pulp) 0 39deg,var(--pith) 39deg 45deg)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lemon)}

/* 내 코인 */
.picker{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--lemon);border-color:var(--lemon);color:var(--on-lemon);font-weight:600}
.mehead{display:flex;align-items:center;gap:14px}
.mehead .dot{width:52px;height:52px;border-width:4px}
.mehead .nm{font-family:var(--display);font-size:24px;line-height:1.1}
.mehead .big{margin-left:auto;text-align:right;flex:none}
.mehead .big .meta{white-space:nowrap}
.mehead .big b{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;display:block}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.goal{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.goal .t{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:500}
.goal .bar{height:8px;border-radius:4px}
.recent{display:flex;flex-direction:column;gap:4px}
.recent div{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.recent div span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 순위 */
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;margin-left:auto}
.seg button{border:0;background:none;font-size:13px;font-weight:500;color:var(--muted);padding:5px 12px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:8px;padding-top:4px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pod .who{font-weight:600;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .block{width:100%;border-radius:12px 12px 4px 4px;display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:2px}
.pod .block .n{font-family:var(--mono);font-size:13px;font-weight:600;opacity:.7}
.pod .block b{font-family:var(--mono);font-size:24px;font-weight:600;line-height:1}
.p1 .block{background:var(--lemon);color:var(--on-lemon);height:118px}
.p2 .block{background:var(--silver);color:var(--ink);height:92px}
.p3 .block{background:var(--bronze);color:var(--on-lemon);height:74px}
@media (prefers-reduced-motion:no-preference){.pod .block{animation:grow .6s cubic-bezier(.2,.9,.3,1.15) both;transform-origin:bottom}.p2 .block{animation-delay:.08s}.p3 .block{animation-delay:.16s}}
@keyframes grow{from{transform:scaleY(.15)}to{transform:none}}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.me{background:var(--lemon-soft)}
.rank{font-family:var(--mono);font-size:14px;color:var(--muted);text-align:center}
.rank.m1,.rank.m2,.rank.m3{border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-weight:600}
.rank.m1{background:var(--lemon);color:var(--on-lemon)}
.rank.m2{background:var(--silver);color:var(--ink)}
.rank.m3{background:var(--bronze);color:var(--on-lemon)}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .bar{margin-top:5px}
.bal{font-family:var(--mono);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}
.more{align-self:flex-start;border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;padding:0}

/* 명예의 전당 */
.weeks{display:flex;flex-direction:column;gap:8px}
.wk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 12px;border:1px solid transparent}
.wk.now{border-color:var(--lemon);background:var(--lemon-soft)}
.wk .medal{width:34px;height:34px;border-radius:50%;background:var(--lemon);color:var(--on-lemon);display:grid;place-items:center}
.wk .medal svg{width:18px;height:18px}
.wk .t{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wk .champ{font-weight:600;font-size:15px}
.wk .others{font-size:12px;color:var(--muted)}
.livetag{font-size:11px;font-weight:600;background:var(--lemon);color:var(--on-lemon);padding:1px 7px;border-radius:999px}

/* 리워드 메뉴 */
.rewards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rw{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;border:1px solid transparent;min-width:0}
.rw.can{border-color:var(--lemon);background:var(--lemon-soft)}
.rw.wide{grid-column:1/-1}
.rw .l{font-weight:600}
.price{align-self:flex-start;font-family:var(--mono);font-weight:600;background:var(--lemon-soft);color:var(--ink);padding:2px 10px;border-radius:999px;font-size:13px;white-space:nowrap}
.rw.can .price{background:var(--lemon);color:var(--on-lemon)}

/* 모으는 법 */
.cat{font-size:12px;font-weight:600;color:var(--muted);padding:10px 12px 4px;background:var(--bg);border-top:1px solid var(--line);letter-spacing:.04em}
.list>.cat:first-child{border-top:0}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.cat+.item{border-top:0}
.wrap>*{min-width:0}
#app{display:flex;flex-direction:column;gap:16px;min-width:0}
#app>*{min-width:0;max-width:100%}
.price.pen{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.skel{height:120px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
header>.fame-btn{margin-left:auto;align-self:flex-start;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:11px;font-weight:600;padding:6px 10px;border-radius:12px;cursor:pointer}
.fame-btn svg{width:22px;height:22px}
.fame-btn[aria-pressed="true"]{background:var(--lemon);border-color:var(--lemon);color:var(--on-lemon)}
.fame-btn[aria-pressed="true"] path{fill:var(--on-lemon)}
/* 출석 도장 (한 줄) */
.att{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:12px;padding:8px 10px;min-height:44px}
.att .lbl{font-size:12px;font-weight:600;white-space:nowrap}
.days{display:flex;gap:3px;flex:1;min-width:0;justify-content:center}
.slot{width:20px;height:20px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:9px;color:var(--muted);flex:none;box-sizing:border-box;padding:0;background:none}
.slot svg{width:20px;height:20px;display:block}
.slot.on{border:0;transform:rotate(-10deg)}
.slot.today{border-style:solid;border-color:var(--rind);color:var(--ink);font-weight:700}
.att .cnt{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.minibtn{border:0;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:6px 9px;border-radius:999px;white-space:nowrap;cursor:pointer;flex:none}
.minibtn:disabled{opacity:.5}
.done{font-size:12px;font-weight:600;color:var(--good);white-space:nowrap}
.att .tip{font-size:12px;color:var(--muted);flex:1;text-align:center}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;z-index:30;pointer-events:none}
/* 오늘의 퀴즈 띠 + 팝업 */
.qbar{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:11px 14px;font-size:14px;font-weight:600;text-align:left;cursor:pointer;width:100%}
.qbar .go{margin-left:auto;color:var(--lemon);font-size:13px;white-space:nowrap}
.qbar.fin{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.qbar.fin .go{color:var(--good)}.qbar.fin.miss .go{color:var(--muted)}
.scrim{position:fixed;inset:0;background:rgba(20,22,16,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:10px 18px max(28px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 -8px 30px rgba(0,0,0,.15)}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);align-self:center;flex:none}
.sheet .q-h{display:flex;align-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.sheet .x{margin-left:auto;border:0;background:var(--bg);width:30px;height:30px;border-radius:50%;font-size:17px;cursor:pointer}
.sheet .q{font-size:18px;font-weight:600;line-height:1.45}
.sheet .opts{display:grid;gap:6px}
.sheet .opt{border:1px solid var(--line);background:var(--bg);text-align:left;font-size:15px;padding:12px 14px;border-radius:12px;cursor:pointer}
.sheet .opt:disabled{cursor:default}
.sheet .opt.ok{background:var(--lemon);border-color:var(--lemon);color:var(--on-lemon);font-weight:600}
.sheet .opt.no{border-color:var(--bad);color:var(--bad)}
.sheet .res{background:var(--lemon-soft);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55}
.sheet .res.no{background:var(--bg)}
.sheet .res b{display:block;font-size:15px;margin-bottom:2px}
.qstat{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.qstat .bar{flex:1;height:6px;border-radius:99px;background:var(--bg);overflow:hidden}.qstat .bar i{display:block;height:100%;background:var(--lemon)}
.sheet .picker{flex-wrap:wrap}
footer{color:var(--muted);font-size:12px;text-align:center;padding-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="coin" viewBox="0 0 44 44" aria-hidden="true"><g transform="translate(1 3)"><circle cx="20" cy="20" r="19" fill="var(--rind)"/><circle cx="20" cy="20" r="16.4" fill="var(--pith)"/><circle cx="20" cy="20" r="14.6" fill="var(--pulp)"/><path d="M33.4 25.55L6.6 14.45M25.55 33.4L14.45 6.6M14.45 33.4L25.55 6.6M6.6 25.55L33.4 14.45" stroke="var(--pith)" stroke-width="1.5" stroke-linecap="round"/><circle cx="20" cy="20" r="2.6" fill="var(--pith)"/></g><path d="M31 7.5C33 2.5 38.5 1 42.5 2.2 41.3 6.4 37 9.6 31 7.5z" fill="var(--leaf)"/></svg>
    <div>
      <div class="ttl"><h1>레몬코인</h1><span class="store">파르나스 스토어</span></div>
      <p class="sub">모으고, 바꾸고, 함께 성장하기</p>
    </div>
    <button id="fameBtn" class="fame-btn" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 14.8V17h3v4H8v-4h3v-2.2A5 5 0 0 1 8.3 12H8a4 4 0 0 1-4-4V5h3V3zm0 4H6v1a2 2 0 0 0 1 1.7V7zm10 0v2.7A2 2 0 0 0 18 8V7h-1z" fill="var(--rind)"/></svg>명예의 전당</button>
  </header>
  <div class="updated"><span class="live" id="live"></span><span id="updated">불러오는 중…</span></div>
  <main id="app"><div class="skel"></div><div class="skel"></div></main>
  <footer>매니저룸 컴퓨터에서도 볼 수 있어요 · 리워드 교환은 리더십에게 말해주세요</footer>
</div>

<script>
const SHEET_ID='1cy61oMImMDPdjr0wOP0iMHJWYGn5Za26s620THmcSx8';
const S={data:null,err:false,me:null,by:'e',showAll:false,fame:false};
try{S.me=localStorage.getItem('lemoncoin.me')}catch(e){}
try{const b=localStorage.getItem('lemoncoin.by');if(b==='e'||b==='w')S.by=b}catch(e){}

function h(tag,attrs,...kids){const el=document.createElement(tag);
  for(const k in attrs||{}){const v=attrs[k];if(v==null||v===false)continue;if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else if(k==='text')el.textContent=v;else el.setAttribute(k,v===true?'':v)}
  for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c instanceof Node?c:document.createTextNode(c))}return el}
const ago=iso=>{const s=(Date.now()-new Date(iso))/1000;if(s<90)return '방금';if(s<3600)return Math.round(s/60)+'분 전';if(s<86400)return Math.round(s/3600)+'시간 전';return Math.round(s/86400)+'일 전'};
const md=d=>{const [,m,dd]=d.split('-').map(Number);return `${m}/${dd}`};
const pad=n=>String(n).padStart(2,'0');
const ymd=t=>`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;
function curMonday(){const t=new Date();t.setDate(t.getDate()-(t.getDay()+6)%7);return ymd(t)}
const sgn=n=>(n>0?'+':'')+n;
const TROPHY='<svg viewBox="0 0 24 24"><path d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 14.8V17h3v4H8v-4h3v-2.2A5 5 0 0 1 8.3 12H8a4 4 0 0 1-4-4V5h3V3zm0 4H6v1a2 2 0 0 0 1 1.7V7zm10 0v2.7A2 2 0 0 0 18 8V7h-1z" fill="currentColor"/></svg>';

/* data: Google Sheet via JSONP (no login) */
let reqN=0;
function load(){const cb='__lc'+(++reqN);const sc=document.createElement('script');let done=false;
  const end=()=>{delete window[cb];sc.remove()};
  const fail=()=>{if(done)return;done=true;end();S.err=true;S.data?stamp():render()};
  window[cb]=resp=>{if(done)return;done=true;end();let same=false;
    try{const d=JSON.parse(resp.table.rows[0].c[0].v);if(!d||!d.members)throw 0;same=!!(S.data&&S.data.u===d.u&&!S.err);S.data=d;S.err=false}catch(e){S.err=true}
    same?stamp():render()};
  sc.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&sheet=public&range=A1&headers=0&t=${Date.now()}`;
  sc.onerror=fail;setTimeout(fail,15000);document.head.append(sc)}

function rankOf(list,key){const s=[...list].sort((a,b)=>b[key]-a[key]||a.n.localeCompare(b.n,'ko'));let prev=null,rk=0;return s.map((m,i)=>{if(m[key]!==prev){rk=i+1;prev=m[key]}return {...m,rk}})}

function tickerView(d){
  const items=d.feed.slice(0,14).map(f=>f.k==='redeem'?[f.n,` ${f.l} 교환! 축하해요`]:[f.n,` ${f.l} ${sgn(f.c)}`]);
  if(!items.length)return null;
  return h('div',{class:'ticker','aria-label':'최근 소식'},h('div',{class:'ticker-track',style:`--dur:${Math.max(28,items.length*4.5)}s`},[...items,...items].map(([b,t],i)=>h('span',{'aria-hidden':i>=items.length?'true':null},h('b',{},b),t))))}


/* ---------- 출석 도장 · 오늘의 퀴즈 (Apps Script) ---------- */
const API='https://script.google.com/macros/s/AKfycbx4fwPV2YrbsykVepAAkzwVsjzJHn2JzyfQOvY23XpGNDoLc57ZfsGgKFyaL1aR-lj7Vw/exec';
const DOWS=['월','화','수','목','금','토','일'];
const Q={st:{},busy:false,open:false,pick:null,err:''};
function api(params){const u=new URL(API);for(const k in params)if(params[k]!=null)u.searchParams.set(k,params[k]);
  return fetch(u).then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(j.err||'fail');return j})}
function refreshState(){if(!API)return;const who=S.me||'';
  api({a:'state',name:who}).then(j=>{Q.st[who]=j;Q.err='';render();renderSheet()}).catch(()=>{Q.err='net';render()})}
const curState=()=>Q.st[S.me||'']||null;
const anyState=()=>curState()||Q.st['']||Object.values(Q.st)[0]||null;
const STAMPSVG=gold=>`<svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="${gold?'#E9BD10':'#F3D433'}"/><circle cx="22" cy="22" r="16" fill="none" stroke="${gold?'#FFF6C8':'#2B2400'}" stroke-width="1.5" stroke-dasharray="2 2.2" opacity=".55"/><path d="M33 26.5L11 17.5M26.5 33L17.5 11M17.5 33L26.5 11M11 26.5L33 17.5" stroke="#FFFBE8" stroke-width="2" stroke-linecap="round"/>${gold?'<path d="M22 3.5l2 4 4.4.6-3.2 3 .8 4.3L22 13.3l-4 2.1.8-4.3-3.2-3 4.4-.6z" fill="#FFF6C8"/>':''}</svg>`;
function n2d(n){return new Date(Math.floor(n/10000),Math.floor(n/100)%100-1,n%100)}
function toast(t){const el=h('div',{class:'toast',role:'status'},t);document.body.append(el);setTimeout(()=>el.remove(),1800)}
function attView(){
  if(!API||!S.me)return null;const st=curState();
  if(!st)return h('div',{class:'att'},h('span',{class:'lbl'},'🍋 출석'),h('span',{class:'tip'},Q.err?'도장을 불러오지 못했어요':'불러오는 중…'));
  const mon=n2d(st.monday),todayI=Math.round((n2d(st.today)-mon)/86400000);const by={};for(const x of st.stamps)by[Math.round((n2d(x.d)-mon)/86400000)]=x;
  const cnt=st.stamps.length,mine=by[todayI];
  return h('div',{class:'att'},h('span',{class:'lbl'},'🍋 출석'),
    h('div',{class:'days',role:'list','aria-label':`이번 주 출석 ${cnt}일`},DOWS.map((d,i)=>{const x=by[i];
      const el=h('button',{class:'slot'+(x?' on':'')+(i===todayI&&!x?' today':''),role:'listitem','aria-label':`${d}요일 ${x?(x.g?'골드 도장':'도장'):'비어 있음'}`,onclick:x&&x.g?()=>toast('퀴즈 정답! 골드 도장 🍋'):null});
      if(x)el.innerHTML=STAMPSVG(x.g);else el.textContent=d;return el})),
    h('span',{class:'cnt'},`${Math.min(cnt,5)}/5`),
    mine?h('span',{class:'done'},cnt>=5?'🎉 개근':'✓ 완료'):h('button',{class:'minibtn',disabled:Q.busy,onclick:doStamp},'도장 찍기'))}
function doStamp(){if(Q.busy||!S.me)return;Q.busy=true;render();const who=S.me;
  api({a:'stamp',name:who}).then(j=>{Q.st[who]=j;Q.busy=false;const c=j.stamps.length;toast(c>=5?'5개 달성! 이번 주 개근 🎉':'오늘 도장 쾅! 🍋');render()})
    .catch(()=>{Q.busy=false;toast('도장을 못 찍었어요. 다시 눌러 주세요');render()})}
function quizBar(){const st=anyState();if(!API||!st||!st.quiz)return null;const mine=curState();const dn=mine&&mine.quiz&&mine.quiz.done;
  if(dn)return h('button',{class:'qbar fin'+(dn.ok?'':' miss'),onclick:openQuiz},'🍋 오늘의 퀴즈',h('span',{class:'go'},dn.ok?'✓ 정답! 결과 보기':'결과 보기'));
  return h('button',{class:'qbar',onclick:openQuiz},'🍋 오늘의 퀴즈 도착!',h('span',{class:'go'},'풀어보기 →'))}
function openQuiz(){Q.open=true;Q.pick=null;renderSheet()}
function closeQuiz(){Q.open=false;renderSheet()}
function renderSheet(){let el=document.getElementById('qsheet');if(!Q.open){if(el)el.remove();return}
  const body=sheetBody();if(!el){el=h('div',{id:'qsheet',class:'scrim',onclick:e=>{if(e.target===el)closeQuiz()}});document.body.append(el)}
  el.replaceChildren(body)}
function sheetBody(){const st=curState()||anyState();const qz=st&&st.quiz;
  const head=h('div',{class:'q-h'},'오늘의 퀴즈',h('button',{class:'x','aria-label':'닫기',onclick:closeQuiz},'×'));
  const box=h('div',{class:'sheet',role:'dialog','aria-modal':'true','aria-label':'오늘의 퀴즈'},h('span',{class:'grab'}),head);
  if(!qz){box.append(h('div',{class:'note'},'오늘은 퀴즈가 없어요.'));return box}
  if(!S.me){const names=(S.data?S.data.members:[]).map(m=>m.n).sort((a,b)=>a.localeCompare(b,'ko'));
    box.append(h('div',{class:'q'},'누구세요?'),h('div',{class:'meta'},'이름을 고르면 퀴즈가 시작돼요. 정답이면 골드 도장!'),
      h('div',{class:'picker'},names.map(n=>h('button',{class:'chip',onclick:()=>{S.me=n;try{localStorage.setItem('lemoncoin.me',n)}catch(e){}render();refreshState();renderSheet()}},n))));return box}
  const mine=curState();if(!mine){box.append(h('div',{class:'note'},'불러오는 중…'));return box}
  const q=mine.quiz,dn=q.done;
  box.append(h('div',{class:'meta'},`${S.me}의 도전`),h('div',{class:'q'},q.q),
    h('div',{class:'opts'},q.opts.map((o,i)=>{const n=i+1;let cls='opt';let pre='';
      if(dn){if(n===dn.ans){cls+=' ok';pre='✓ '}else if(n===dn.c){cls+=' no';pre='✕ '}}else if(Q.pick===n)cls+=' ok';
      return h('button',{class:cls,disabled:!!dn||Q.busy,onclick:()=>answerQuiz(n)},pre+o)})));
  if(dn){box.append(h('div',{class:'res'+(dn.ok?'':' no')},h('b',{},dn.ok?'정답이에요! 🎉':'아쉽지만 오답이에요'),
      (dn.ex?dn.ex+' ':'')+(dn.ok?'오늘 도장이 골드로 바뀌었어요.':'출석 도장은 찍혔어요. 내일 또 도전!')));
    const s=q.stats,pct=s.n?Math.round(s.ok/s.n*100):0;
    box.append(h('div',{class:'qstat'},'팀 정답률',h('span',{class:'bar'},h('i',{style:`width:${pct}%`})),`${pct}% · ${s.n}명 참여`))}
  else box.append(h('div',{class:'meta'},Q.busy?'채점 중…':'한 번만 고를 수 있어요. 신중하게!'));
  return box}
function answerQuiz(n){if(Q.busy||!S.me)return;Q.busy=true;Q.pick=n;renderSheet();const who=S.me;
  api({a:'answer',name:who,c:n}).then(j=>{Q.st[who]=j;Q.busy=false;Q.pick=null;render();renderSheet()})
    .catch(()=>{Q.busy=false;Q.pick=null;toast('전송에 실패했어요. 다시 눌러 주세요');renderSheet()})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&Q.open)closeQuiz()});

function meView(d){
  const names=[...d.members].map(m=>m.n).sort((a,b)=>a.localeCompare(b,'ko'));
  const card=h('section',{class:'card'},h('div',{class:'card-h'},h('h2',{},'내 코인'),h('span',{class:'meta'},S.me?'다른 이름을 누르면 바뀌어요':'내 이름을 눌러 주세요')));
  card.append(h('div',{class:'picker',role:'group','aria-label':'이름 선택'},names.map(n=>h('button',{class:'chip','aria-pressed':String(S.me===n),onclick:()=>{S.me=S.me===n?null:n;try{S.me?localStorage.setItem('lemoncoin.me',n):localStorage.removeItem('lemoncoin.me')}catch(e){}render();if(S.me&&!Q.st[S.me])refreshState()}},n))));
  const m=d.members.find(x=>x.n===S.me);if(!m)return card;
  const rk=rankOf(d.members,'e').find(x=>x.n===m.n).rk;
  const T=d.rewards.filter(r=>!r.f).sort((a,b)=>a.c-b.c);const can=T.filter(t=>t.c<=m.b);const next=T.find(t=>t.c>m.b);
  card.append(
    h('div',{class:'mehead'},h('span',{class:'dot'}),h('div',{style:'min-width:0'},h('div',{class:'nm'},m.n),h('div',{class:'meta'},can.length?`지금 바꿀 수 있어요: ${can.map(t=>t.l).join(', ')}`:'첫 리워드까지 조금만 더!')),
      h('div',{class:'big'},h('b',{},String(m.b)),h('span',{class:'meta'},'보유 코인'))),
    h('div',{class:'strip'},h('div',{class:'stat'},h('b',{},String(m.e)),h('span',{},'누적 코인')),h('div',{class:'stat'},h('b',{},rk+'위'),h('span',{},`${d.members.length}명 중`)),h('div',{class:'stat'},h('b',{},sgn(m.w)),h('span',{},'이번 주'))));
  if(next)card.append(h('div',{class:'goal'},h('div',{class:'t'},h('span',{},`${next.l}까지`),h('span',{},`${next.c-m.b}코인 남았어요`)),h('div',{class:'bar'},h('i',{style:`width:${Math.max(3,m.b/next.c*100)}%`}))));
  else if(T.length)card.append(h('div',{class:'goal'},h('div',{class:'t'},h('span',{},'모든 리워드를 바꿀 수 있어요'),h('span',{},'리더십에게 말해주세요'))));
  {const at=attView();if(at)card.append(at)}
  const mine=d.feed.filter(f=>f.n===m.n).slice(0,5);
  if(mine.length)card.append(h('div',{class:'recent'},h('div',{class:'meta',style:'font-weight:600'},'최근 내역'),mine.map(f=>h('div',{},h('span',{},`${md(f.d)} ${f.k==='redeem'?f.l+' 교환':f.l}`),h('span',{class:'amt '+(f.c>=0?'p':'m')},sgn(f.c))))));
  return card}

function rankView(d){
  const key=S.by;const r=rankOf(d.members,key);const top=r.filter(x=>x[key]>0&&x.rk<=3).slice(0,3);
  const card=h('section',{class:'card'},h('div',{class:'card-h'},h('h2',{},'순위'),
    h('div',{class:'seg',role:'group','aria-label':'순위 기준'},[['e','누적'],['w','이번 주']].map(([k,l])=>h('button',{'aria-pressed':String(key===k),onclick:()=>{S.by=k;try{localStorage.setItem('lemoncoin.by',k)}catch(e){}render()}},l)))));
  if(top.length){const order=[top[1],top[0],top[2]];
    card.append(h('div',{class:'podium'},order.map((x,i)=>{if(!x)return h('div');return h('div',{class:'pod p'+Math.min(x.rk,3)},h('div',{class:'who'},x.n),
      h('div',{class:'block'},h('span',{class:'n'},x.rk+'위'),h('b',{},key==='w'?sgn(x[key]):String(x[key]))))})))}
  else card.append(h('div',{class:'meta'},key==='w'?'이번 주 첫 코인의 주인공은 누가 될까요?':'아직 코인을 받은 사람이 없어요.'));
  const rest=S.showAll?r:r.slice(0,10);const max=Math.max(1,...r.map(x=>x[key]));
  card.append(h('div',{class:'list'},rest.map(x=>h('div',{class:'row'+(x.n===S.me?' me':'')},h('span',{class:'rank'+(x.rk<=3&&x[key]>0?' m'+x.rk:'')},String(x.rk)),
    h('div',{style:'min-width:0'},h('div',{class:'name'},x.n+(x.n===S.me?' (나)':'')),h('div',{class:'bar'},h('i',{style:`width:${Math.max(0,x[key])/max*100}%`}))),
    h('span',{class:'bal'},h('span',{class:'dot'}),key==='w'?sgn(x[key]):String(x[key]))))));
  if(r.length>10)card.append(h('button',{class:'more',onclick:()=>{S.showAll=!S.showAll;render()}},S.showAll?'접기':`전체 ${r.length}명 보기`));
  return card}

function fameView(d){
  if(!d.weeks.length)return null;const cur=curMonday();
  return h('section',{class:'card'},h('div',{class:'card-h'},h('h2',{},'명예의 전당'),h('span',{class:'meta'},'주간 1등'),h('button',{class:'more',style:'margin-left:auto',onclick:()=>setFame(false)},'← 돌아가기')),
    h('div',{class:'weeks'},d.weeks.map(w=>{const [c,...o]=w.s;const now=w.w===cur;const medal=h('span',{class:'medal'});medal.innerHTML=TROPHY;
      return h('div',{class:'wk'+(now?' now':'')},medal,
        h('div',{style:'min-width:0'},h('div',{class:'t'},`${w.t} · ${w.r}`,now?h('span',{class:'livetag'},'진행 중'):null),
          h('div',{class:'champ'},c?c[0]:'-'),o.length?h('div',{class:'others'},o.slice(0,2).map((x,i)=>`${i+2}위 ${x[0]} ${sgn(x[1])}`).join(' · ')):null),
        c?h('span',{class:'amt p',style:'font-size:17px'},sgn(c[1])):null)})))}

function menuView(d){
  const me=d.members.find(x=>x.n===S.me);
  return h('section',{class:'card'},h('div',{class:'card-h'},h('h2',{},'리워드 메뉴'),h('span',{class:'meta'},'리워드 교환은 리더십에게 말해주세요')),
    h('div',{class:'rewards'},d.rewards.map(r=>h('div',{class:'rw'+(r.f?' wide':'')+(me&&!r.f&&me.b>=r.c?' can':'')},
      h('div',{class:'l'},r.l),r.d?h('div',{class:'meta'},r.d):null,h('span',{class:'price'},r.f?'1코인 = 1,000원':r.c+'코인'),
      r.lim?h('div',{class:'meta'},r.lim):null,r.f?h('div',{class:'meta'},'모은 코인으로 원하는 걸 골라요'):null))),
    me?h('div',{class:'meta'},'노랗게 표시된 리워드는 지금 바로 바꿀 수 있어요.'):null)}

function earnView(d){
  const list=h('div',{class:'list'});let cat=null;
  for(const r of d.rules){if(r.g!==cat){cat=r.g;list.append(h('div',{class:'cat'},cat))}
    list.append(h('div',{class:'item'},h('div',{style:'min-width:0'},h('div',{style:'font-weight:600'},r.l),r.d?h('div',{class:'meta'},r.d):null),h('span',{class:'price'},'+'+r.c)))}
  if(d.penalties&&d.penalties.length){list.append(h('div',{class:'cat'},'패널티'));
    for(const r of d.penalties)list.append(h('div',{class:'item'},h('div',{style:'min-width:0'},h('div',{style:'font-weight:600'},r.l),r.d?h('div',{class:'meta'},r.d):null),h('span',{class:'price pen'},'−'+r.c)))}
  return h('section',{class:'card'},h('div',{class:'card-h'},h('h2',{},'코인 모으는 법')),list)}

function stamp(){const d=S.data;const live=document.getElementById('live'),up=document.getElementById('updated');
  live.classList.toggle('off',S.err||!d);
  up.textContent=!d?(S.err?'연결하지 못했어요':'불러오는 중…'):(d.u?ago(d.u)+' 업데이트':'업데이트 시간 없음')+(S.err?' · 새 정보 확인 실패':'')}

function render(){stamp();const app=document.getElementById('app');const d=S.data;
  if(!d){if(S.err)app.replaceChildren(h('div',{class:'note warn'},'레몬코인 현황을 불러오지 못했어요. 잠시 후 새로고침해 주세요.'));return}
  if(S.fame){app.replaceChildren(fameView(d)||h('div',{class:'note'},'아직 기록된 주가 없어요.'));return}
  app.replaceChildren(...[tickerView(d),quizBar(),meView(d),rankView(d),menuView(d),earnView(d)].filter(Boolean))}
function setFame(on){S.fame=on;document.getElementById('fameBtn').setAttribute('aria-pressed',on);render();window.scrollTo(0,0)}
document.getElementById('fameBtn').addEventListener('click',()=>setFame(!S.fame));

load();refreshState();
setInterval(()=>{if(!document.hidden)load()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){load();refreshState()}});
setInterval(stamp,30000);
</script>
