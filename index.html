<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F5F6EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13150F" media="(prefers-color-scheme: dark)">
<title>레몬코인 · 파르나스</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%23E9BD10'/%3E%3Ccircle cx='20' cy='20' r='16' fill='%23FFFBE8'/%3E%3Ccircle cx='20' cy='20' r='14' fill='%23F8E15A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Same system as the 레몬코인 보드: one narrow column, header + celebration line + tabs, quiet cards, lemon accent only where it means something */
:root{
  --bg:#F5F6EF; --surface:#FFFFFF; --ink:#1B1E17; --muted:#666B5E; --line:#E1E3D7;
  --lemon:#F3D433; --lemon-soft:#FBF0B4; --on-lemon:#2B2400; --good:#2E7A4C; --bad:#B0432E;
  --silver:#D9DCD2; --bronze:#C9894F;
  --rind:#E9BD10; --pith:#FFFBE8; --pulp:#F8E15A; --leaf:#4F9A3C;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#13150F; --surface:#1C1F17; --ink:#EDEFE4; --muted:#9CA190; --line:#2E3227;
  --lemon:#E9C925; --lemon-soft:#3A3412; --on-lemon:#231D00; --good:#6CC08E; --bad:#E4826C; --silver:#4C5145; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:max(48px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

header{display:flex;align-items:center;gap:12px}
header>div{min-width:0}
.coin{width:46px;height:46px;flex:none}
.ttl{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1;margin:0;letter-spacing:.01em}
.store{font-size:12px;font-weight:500;color:var(--muted);opacity:.75;letter-spacing:.02em}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.fame-btn{margin-left:auto;align-self:flex-start;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:11px;font-weight:600;padding:6px 10px;border-radius:12px;cursor:pointer}
.fame-btn svg{width:22px;height:22px}
.fame-btn[aria-pressed="true"]{background:var(--lemon);border-color:var(--lemon);color:var(--on-lemon)}

.cele{display:flex;align-items:center;gap:10px;background:var(--lemon);color:var(--on-lemon);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500;min-width:0}
.cele p{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cele b{font-weight:700}
.cele small{flex:none;margin-left:auto;font-size:12px;opacity:.7}
@media (prefers-reduced-motion:no-preference){.cele p{animation:fade .4s ease both}@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}}

.updated{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:-8px}
.live{width:7px;height:7px;border-radius:50%;background:var(--good)}
.live.off{background:var(--bad)}

nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
nav button{flex:1;white-space:nowrap;border:0;background:none;color:var(--muted);font-size:14px;font-weight:500;padding:8px 12px;border-radius:999px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--lemon);color:var(--on-lemon)}

section{display:flex;flex-direction:column;gap:10px}
h2{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--muted);margin:6px 0 0}
.meta{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
.note.warn{border-style:solid;border-color:var(--bad);color:var(--bad)}

.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;align-self:flex-start}
.seg button{border:0;background:none;font-size:13px;font-weight:500;color:var(--muted);padding:6px 14px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.list>div:first-child>.row{border-top:0}
.row.me{background:var(--lemon-soft)}
.rank{font-family:var(--mono);font-size:14px;color:var(--muted);text-align:center}
.rank.m1,.rank.m2,.rank.m3{border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-weight:600}
.rank.m1{background:var(--lemon);color:var(--on-lemon)}
.rank.m2{background:var(--silver);color:var(--ink)}
.rank.m3{background:var(--bronze);color:var(--on-lemon)}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lemon)}
.bal{font-family:var(--mono);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}
.bal small{font-size:11px;color:var(--muted);font-weight:500}
.dot{width:16px;height:16px;flex:none;border-radius:50%;border:2px solid var(--rind);box-shadow:inset 0 0 0 1px var(--pith);background:radial-gradient(circle,var(--pith) 0 16%,transparent 17%),repeating-conic-gradient(from 22.5deg,var(--pulp) 0 39deg,var(--pith) 39deg 45deg)}
.hist{background:var(--bg);padding:6px 14px 10px 52px;display:flex;flex-direction:column;gap:4px}
.hl{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.hl span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.amt.p{color:var(--good)} .amt.m{color:var(--bad)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);font-size:13px;padding:6px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--lemon);border-color:var(--lemon);color:var(--on-lemon);font-weight:600}
.mehead{display:flex;align-items:center;gap:14px}
.mehead .big{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.mehead .nm{font-family:var(--display);font-size:24px;line-height:1.1}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.goal .t{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:500}
.goal .bar{height:8px}

.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.list>.item:first-child{border-top:0}
.cat{font-size:12px;font-weight:600;color:var(--muted);padding:10px 14px 4px;background:var(--bg);border-top:1px solid var(--line);letter-spacing:.04em}
.list>.cat:first-child{border-top:0}
.cat+.item{border-top:0}
.price{font-family:var(--mono);font-weight:600;background:var(--lemon-soft);color:var(--ink);padding:2px 10px;border-radius:999px;font-size:13px;white-space:nowrap}
.item.can .price{background:var(--lemon);color:var(--on-lemon)}

.week{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.week.now{border-color:var(--lemon);box-shadow:0 0 0 1px var(--lemon)}
.wk-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wk-h b{font-family:var(--display);font-weight:400;font-size:19px}
.livetag{flex:none;font-size:11px;font-weight:600;background:var(--lemon);color:var(--on-lemon);padding:2px 8px;border-radius:999px}
.pod{display:flex;flex-direction:column;gap:6px}
.pr{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center}
.more{align-self:flex-start;border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:0}
.skel{height:56px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
footer{color:var(--muted);font-size:12px;text-align:center;padding-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="coin" viewBox="0 0 44 44" aria-hidden="true"><g transform="translate(1 3)"><circle cx="20" cy="20" r="19" fill="var(--rind)"/><circle cx="20" cy="20" r="16.4" fill="var(--pith)"/><circle cx="20" cy="20" r="14.6" fill="var(--pulp)"/><path d="M33.4 25.55L6.6 14.45M25.55 33.4L14.45 6.6M14.45 33.4L25.55 6.6M6.6 25.55L33.4 14.45" stroke="var(--pith)" stroke-width="1.5" stroke-linecap="round"/><circle cx="20" cy="20" r="2.6" fill="var(--pith)"/></g><path d="M31 7.5C33 2.5 38.5 1 42.5 2.2 41.3 6.4 37 9.6 31 7.5z" fill="var(--leaf)"/></svg>
    <div>
      <div class="ttl"><h1>레몬코인</h1><span class="store">파르나스 스토어</span></div>
      <p class="sub">모으고, 바꾸고, 함께 성장하기</p>
    </div>
    <button id="fameBtn" class="fame-btn" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 14.8V17h3v4H8v-4h3v-2.2A5 5 0 0 1 8.3 12H8a4 4 0 0 1-4-4V5h3V3zm0 4H6v1a2 2 0 0 0 1 1.7V7zm10 0v2.7A2 2 0 0 0 18 8V7h-1z" fill="var(--rind)"/></svg>명예의 전당</button>
  </header>
  <div id="cele" class="cele" role="status" hidden></div>
  <div class="updated"><span class="live" id="live"></span><span id="updated">불러오는 중…</span></div>
  <nav role="tablist" id="tabs"></nav>
  <main id="main"><div class="skel"></div></main>
  <footer>매니저룸 컴퓨터에서도 볼 수 있어요 · 리워드 교환은 리더에게 말해 주세요</footer>
</div>

<script>
const SHEET_ID='1cy61oMImMDPdjr0wOP0iMHJWYGn5Za26s620THmcSx8';
const S={data:null,err:false,tab:'rank',by:'e',open:null,me:null,fameOpen:undefined};
try{S.me=localStorage.getItem('lemoncoin.me')}catch(e){}
try{S.by=localStorage.getItem('lemoncoin.by')||'e'}catch(e){}

function h(tag,attrs,...kids){const el=document.createElement(tag);
  for(const k in attrs||{}){const v=attrs[k];if(v==null||v===false)continue;if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else if(k==='text')el.textContent=v;else el.setAttribute(k,v===true?'':v)}
  for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c instanceof Node?c:document.createTextNode(c))}return el}
const ago=iso=>{const s=(Date.now()-new Date(iso))/1000;if(s<90)return '방금';if(s<3600)return Math.round(s/60)+'분 전';if(s<86400)return Math.round(s/3600)+'시간 전';return Math.round(s/86400)+'일 전'};
const md=d=>{const [,m,dd]=d.split('-').map(Number);return `${m}/${dd}`};
const pad=n=>String(n).padStart(2,'0');
const ymd=t=>`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;
function curMonday(){const t=new Date();t.setDate(t.getDate()-(t.getDay()+6)%7);return ymd(t)}
const sgn=n=>(n>0?'+':'')+n;

/* data: Google Sheet via JSONP (no login) */
let reqN=0;
function load(){const cb='__lc'+(++reqN);const sc=document.createElement('script');let done=false;
  const end=()=>{delete window[cb];sc.remove()};
  const fail=()=>{if(done)return;done=true;end();S.err=true;S.data?stamp():render()};
  window[cb]=resp=>{if(done)return;done=true;end();let same=false;
    try{const d=JSON.parse(resp.table.rows[0].c[0].v);if(!d||!d.members)throw 0;same=!!(S.data&&S.data.u===d.u&&!S.err);S.data=d;S.err=false}catch(e){S.err=true}
    same?stamp():render()};
  sc.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&sheet=public&range=A1&headers=0&t=${Date.now()}`;
  sc.onerror=fail;setTimeout(fail,15000);document.head.append(sc)}

function rankOf(list,key){const s=[...list].sort((a,b)=>b[key]-a[key]||a.n.localeCompare(b.n,'ko'));let prev=null,rk=0;return s.map((m,i)=>{if(m[key]!==prev){rk=i+1;prev=m[key]}return {...m,rk}})}
const tiers=d=>d.rewards.filter(r=>!r.f).sort((a,b)=>a.c-b.c);

/* celebration line: recent rewards, then today's coins */
let celeIdx=0,celeTimer=null;
function celebrate(d){const box=document.getElementById('cele');clearInterval(celeTimer);
  const cut=new Date();cut.setDate(cut.getDate()-3);const since=ymd(cut),today=ymd(new Date());
  const items=[...d.feed.filter(f=>f.k==='redeem'&&f.d>=since).map(f=>({b:f.n+'님',t:` ${f.l} 리워드 받았어요! 축하해요`,s:f.d===today?'오늘':md(f.d)})),
    ...d.feed.filter(f=>f.k==='earn'&&f.d===today).map(f=>({b:f.n,t:` ${f.l} ${sgn(f.c)}`,s:'오늘'}))];
  if(!items.length){box.hidden=true;return}
  const show=()=>{const it=items[celeIdx%items.length];box.replaceChildren(h('p',{},h('b',{},it.b),it.t),h('small',{},items.length>1?`${it.s} · ${celeIdx%items.length+1}/${items.length}`:it.s));box.hidden=false};
  show();if(items.length>1&&!matchMedia('(prefers-reduced-motion: reduce)').matches)celeTimer=setInterval(()=>{celeIdx++;show()},4000)}

function tabs(){const nav=document.getElementById('tabs');
  nav.replaceChildren(...[['rank','순위'],['me','내 코인'],['menu','리워드·적립']].map(([k,l])=>h('button',{role:'tab','aria-selected':String(S.tab===k),onclick:()=>{S.tab=k;render();scrollTo({top:0})}},l)));
  document.getElementById('fameBtn').setAttribute('aria-pressed',String(S.tab==='fame'))}

function rankView(d){
  const key=S.by,label={e:'누적',b:'보유',w:'이번 주'}[key];
  const r=rankOf(d.members,key);const max=Math.max(1,...r.map(x=>x[key]));
  const seg=h('div',{class:'seg',role:'group','aria-label':'순위 기준'},[['e','누적 코인'],['b','현재 보유'],['w','이번 주']].map(([k,l])=>h('button',{'aria-pressed':String(key===k),onclick:()=>{S.by=k;try{localStorage.setItem('lemoncoin.by',k)}catch(e){}render()}},l)));
  return h('section',{},seg,h('div',{class:'list'},r.map(m=>{const open=S.open===m.n;
    const mine=d.feed.filter(f=>f.n===m.n).slice(0,6);
    const sub=key==='e'?`보유 ${m.b} · 이번 주 ${sgn(m.w)}`:key==='b'?`누적 ${m.e} · 이번 주 ${sgn(m.w)}`:`누적 ${m.e} · 보유 ${m.b}`;
    return h('div',{},
      h('button',{class:'row'+(m.n===S.me?' me':''),'aria-expanded':String(open),onclick:()=>{S.open=open?null:m.n;render()}},
        h('span',{class:'rank'+(m.rk<=3&&m[key]>0?' m'+m.rk:'')},String(m.rk)),
        h('div',{style:'min-width:0'},h('div',{class:'name'},m.n+(m.n===S.me?' (나)':'')),h('div',{class:'bar'},h('i',{style:`width:${Math.max(0,m[key])/max*100}%`})),h('div',{class:'meta'},sub)),
        h('span',{class:'bal'},h('span',{class:'dot'}),(key==='w'?sgn(m[key]):String(m[key])),h('small',{},label))),
      open?h('div',{class:'hist'},mine.length?mine.map(f=>h('div',{class:'hl'},h('span',{},`${md(f.d)} ${f.k==='redeem'?f.l+' 교환':f.l}`),h('span',{class:'amt '+(f.c>=0?'p':'m')},sgn(f.c)))):h('div',{class:'meta'},'아직 기록이 없어요')):null)})),
    h('p',{class:'meta'},'이름을 누르면 최근 내역을 볼 수 있어요. 누적은 받은 코인에서 패널티를 뺀 값, 보유는 리워드로 바꾸고 남은 코인이에요.'))}

function meView(d){
  const names=[...d.members].map(m=>m.n).sort((a,b)=>a.localeCompare(b,'ko'));
  const pick=h('div',{class:'panel'},h('div',{class:'meta'},S.me?'다른 이름을 누르면 바뀌어요':'내 이름을 눌러 주세요. 다음에 열 때도 기억해요.'),
    h('div',{class:'chips'},names.map(n=>h('button',{class:'chip','aria-pressed':String(S.me===n),onclick:()=>{S.me=n;try{localStorage.setItem('lemoncoin.me',n)}catch(e){}render()}},n))));
  const m=d.members.find(x=>x.n===S.me);if(!m)return h('section',{},pick);
  const rk=rankOf(d.members,'e').find(x=>x.n===m.n).rk;const T=tiers(d);const can=T.filter(t=>t.c<=m.b);const next=T.find(t=>t.c>m.b);
  const card=h('div',{class:'panel'},
    h('div',{class:'mehead'},h('span',{class:'dot',style:'width:44px;height:44px;border-width:4px'}),h('div',{},h('div',{class:'nm'},m.n+'님'),h('div',{class:'meta'},'지금 보유한 코인')),h('div',{class:'big',style:'margin-left:auto'},String(m.b))),
    h('div',{class:'strip'},h('div',{class:'stat'},h('b',{},String(m.e)),h('span',{},'누적 코인')),h('div',{class:'stat'},h('b',{},rk+'위'),h('span',{},`${d.members.length}명 중`)),h('div',{class:'stat'},h('b',{},sgn(m.w)),h('span',{},'이번 주'))),
    next?h('div',{class:'goal'},h('div',{class:'t'},h('span',{},`${next.l}까지`),h('span',{},`${next.c-m.b}코인 남았어요`)),h('div',{class:'bar'},h('i',{style:`width:${Math.max(3,m.b/next.c*100)}%`}))):null,
    can.length?h('div',{class:'meta'},`지금 바꿀 수 있는 리워드: ${can.map(t=>t.l).join(', ')}`):h('div',{class:'meta'},'첫 리워드까지 조금만 더 모아 봐요.'));
  const mine=d.feed.filter(f=>f.n===m.n).slice(0,8);
  return h('section',{},card,h('h2',{},'최근 내역'),mine.length?h('div',{class:'list'},mine.map(f=>h('div',{class:'item'},h('span',{},h('span',{class:'meta'},md(f.d)+'  '),f.k==='redeem'?f.l+' 교환':f.l),h('span',{class:'amt '+(f.c>=0?'p':'m')},sgn(f.c))))):h('div',{class:'note'},'아직 기록이 없어요.'),pick)}

function menuView(d){
  const me=d.members.find(x=>x.n===S.me);
  const rw=h('div',{class:'list'},d.rewards.map(r=>h('div',{class:'item'+(me&&!r.f&&me.b>=r.c?' can':'')},h('span',{style:'min-width:0'},r.l,r.lim?h('div',{class:'meta'},r.lim):null,r.f?h('div',{class:'meta'},'모은 코인으로 원하는 걸 골라요'):null),h('span',{class:'price'},r.f?'1코인 = 1,000원':r.c+'코인'))));
  const er=h('div',{class:'list'});let cat=null;
  for(const r of d.rules){if(r.g!==cat){cat=r.g;er.append(h('div',{class:'cat'},cat))}
    er.append(h('div',{class:'item'},h('span',{style:'min-width:0'},r.l,r.d?h('div',{class:'meta'},r.d):null),h('span',{class:'price'},'+'+r.c)))}
  return h('section',{},h('h2',{},'리워드'),rw,me?h('p',{class:'meta'},`노랗게 표시된 리워드는 ${me.n}님이 지금 바꿀 수 있어요.`):null,h('h2',{},'적립 기준'),er)}

function fameView(d){
  if(!d.weeks.length)return h('div',{class:'note'},'아직 기록된 주차가 없어요.');
  const cur=curMonday();
  return h('section',{},d.weeks.map(w=>{const all=d.members.map(m=>m.n);const sc=Object.fromEntries(w.s);
    const ranked=rankOf(all.map(n=>({n,c:sc[n]||0})),'c');const podium=ranked.filter(x=>x.rk<=3&&x.c>0);
    const open=S.fameOpen===undefined?w.w===cur:S.fameOpen===w.w;const shown=open?ranked:podium;
    return h('div',{class:'week'+(w.w===cur?' now':'')},
      h('div',{class:'wk-h'},h('div',{},h('b',{},w.t),h('span',{class:'meta'},'  '+w.r)),w.w===cur?h('span',{class:'livetag'},'진행 중'):null),
      shown.length?h('div',{class:'pod'},shown.map(x=>h('div',{class:'pr'},h('span',{class:'rank'+(x.rk<=3&&x.c>0?' m'+x.rk:'')},String(x.rk)),h('span',{class:'name'},x.n+(x.n===S.me?' (나)':'')),h('span',{class:'amt '+(x.c>0?'p':'')},sgn(x.c))))):h('div',{class:'meta'},'아직 적립 기록이 없어요'),
      ranked.length>podium.length?h('button',{class:'more',onclick:()=>{S.fameOpen=open?null:w.w;render()}},open?'접기':`전체 ${ranked.length}명 보기`):null)}),
    h('p',{class:'meta'},'주차는 월요일부터 일요일까지예요. 그 주에 받은 코인으로 순위를 매겨요.'))}

function stamp(){const d=S.data;const live=document.getElementById('live'),up=document.getElementById('updated');
  live.classList.toggle('off',S.err||!d);
  up.textContent=!d?(S.err?'연결하지 못했어요':'불러오는 중…'):(d.u?ago(d.u)+' 업데이트':'업데이트 시간 없음')+(S.err?' · 새 정보 확인 실패':'')}

function render(){stamp();tabs();const main=document.getElementById('main');const d=S.data;
  if(!d){if(S.err)main.replaceChildren(h('div',{class:'note warn'},'레몬코인 현황을 불러오지 못했어요. 잠시 후 새로고침해 주세요.'));return}
  celebrate(d);
  main.replaceChildren(S.tab==='fame'?fameView(d):S.tab==='me'?meView(d):S.tab==='menu'?menuView(d):rankView(d))}

document.getElementById('fameBtn').addEventListener('click',()=>{S.tab=S.tab==='fame'?'rank':'fame';render();scrollTo({top:0})});
if(S.me)S.tab='me';
tabs();load();
setInterval(()=>{if(!document.hidden)load()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
setInterval(stamp,30000);
</script>
</body>
</html>
